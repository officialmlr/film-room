name: Sync dynasty

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download everything, including all 138 rosters"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/sync.yml"]

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull from Dynasty Rewired
        env:
          DR_API_TOKEN: ${{ secrets.DR_API_TOKEN }}
          LEAGUE_IDS: cfb27-5156880
          FORCE_FULL: ${{ github.event_name == 'push' || inputs.full == true }}
        run: node scripts/sync.mjs
      - name: Save changes
        run: |
          git config user.name "film-room-sync"
          git config user.email "film-room-sync@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Sync dynasty data"
            git push
          fi
