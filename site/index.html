<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a sports section's film room: dry, factual, a little opinionated in the blogs.
   IDEA: the Sunday sports page plus a coach's stat sheet; every number from the sync.
   PICTURE: the scoreboard header and the charts are the pictures; no logos, team-colour badges.
   COLOUR and TYPE: cream paper (the owner asked for it), ink, the user school's colour as the one accent; Fraunces heads, Barlow Condensed numbers, Inter text.
   LAYOUT: masthead and tabs, then cards in a wrapping two-column flow that stacks on a phone. */
:root{color-scheme:light dark;--bg:light-dark(#F4EFE4,#14120E);--card:light-dark(#FBF8F1,#1D1A15);--ink:light-dark(#1B1A17,#F1EBDD);--mute:light-dark(#5E5A52,#ADA597);--rule:light-dark(#D8CFBE,#3A342B);--soft:light-dark(#E8E0CF,#2A261F);--team:#E03A3E;--team-ink:#B3262A;--opp:light-dark(#5E5A52,#8F887B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}a:hover{color:var(--mute)}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(3vw,14px)}
header.mast{border-bottom:3px solid var(--ink)}
.mtop{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-top:18px}
.brand{display:flex;gap:14px;align-items:center}
.wordmark{font:900 34px/1 Fraunces,Georgia,serif;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--mute);margin-top:4px}
.kpis{display:flex;gap:26px}
.kpi b{display:block;font:700 34px/1 'Barlow Condensed',sans-serif}
.kpi span{font-size:12px;color:var(--mute)}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:12px}
nav.tabs a{padding:12px 14px;font-size:14px;font-weight:600;text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-3px;min-height:44px}
nav.tabs a[aria-current=page]{color:var(--ink);border-color:var(--team)}
main{padding:22px 0 60px;display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.main{flex:999 1 560px}.side{flex:1 1 300px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
.card.flush{padding:0;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.12;text-wrap:balance}
h2{font-size:21px;font-weight:800}
.lab{font-size:12px;font-weight:700;color:var(--mute)}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.muted{color:var(--mute)}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font:700 12px/1 'Barlow Condensed',sans-serif;letter-spacing:.3px;flex:none;background:color-mix(in srgb,var(--c,#5E5A52) 80%,black)}
.strip{overflow-x:auto;padding-bottom:6px}
.strip .in{display:flex;gap:10px;min-width:max-content}
.gcard{width:108px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;text-decoration:none}
.gcard.cur{border-color:var(--team);border-width:2px;padding:9px}
.pill{font:700 15px/1.2 'Barlow Condensed',sans-serif;border-radius:6px;padding:2px 7px;align-self:flex-start}
.pill.w{background:var(--ink);color:var(--bg)}.pill.l{border:1.5px solid var(--ink);padding:1px 6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:700;text-align:left;padding:7px 6px}
td{padding:8px 6px;border-top:1px solid var(--rule)}
td.n,th.n{text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .big{font:700 60px/1 'Barlow Condensed',sans-serif}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--team)}
.bar>i.o{background:var(--opp)}
.brow{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.brow .num{font-size:19px;text-align:right}
.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px;border-bottom:1px solid var(--rule)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.col .stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.col .v{font:600 14px/1 'Barlow Condensed',sans-serif}
.pair{display:flex;gap:4px;width:100%;max-width:60px;align-items:flex-end;height:100%}
.pair i{flex:1;border-radius:3px 3px 0 0;display:block;min-height:2px}
.xl{display:flex;gap:14px}.xl span{flex:1;text-align:center;font-size:12px;color:var(--mute);padding-top:6px}
.key{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap;margin-top:10px}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.story h3{font-size:26px;font-weight:800;margin:6px 0 8px}
.story .dek{font-family:Fraunces,Georgia,serif;font-size:18px;color:var(--mute);margin:0 0 10px}
.story p{margin:0 0 12px;max-width:70ch}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-weight:600;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--team);outline-offset:2px}
select{min-height:44px;font:16px Inter,sans-serif;padding:0 10px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink)}
.personas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.personas button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--rule);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.personas button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat b{display:block;font:700 30px/1 'Barlow Condensed',sans-serif}.stat span{font-size:12px;color:var(--mute)}
.lead{border-top:2px solid var(--ink);padding-top:8px}
.note{font-size:12px;color:var(--mute)}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:6px;padding:1px 6px;white-space:nowrap}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.empty{padding:20px;text-align:center;color:var(--mute)}
@media(max-width:600px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.score .big{font-size:46px}.kpis{gap:16px}.brow{grid-template-columns:84px minmax(0,1fr) 40px}table{font-size:13px}}
@media(prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <div class="mtop">
    <div class="brand"><span id="mBadge"></span><div><div class="wordmark">Film Room</div><div class="sub" id="mSub">Loading your dynasty…</div></div></div>
    <div class="kpis"><div class="kpi"><span id="kRecLab">Record</span><b id="kRec">–</b></div><div class="kpi"><span>Now</span><b id="kStage">–</b></div></div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#home">Home</a><a href="#schedule">Schedule</a><a href="#roster">Roster</a><a href="#league">League</a><a href="#newsroom">Newsroom</a>
  </nav>
</div></header>
<main class="wrap" id="app" aria-live="polite"><div class="empty">Loading…</div></main>
<footer class="wrap note" style="padding-bottom:30px" id="foot"></footer>

<script>
{
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");
let D = null, T = {}, U = null, UT = null, db = null, sample = null, stories = {};

const PERSONAS = [
  { id: "staff", name: "Film Room Staff", outlet: "Beat writer", ini: "FR", voice: "a straight, professional newspaper beat writer. Clear game story: result first, key performers, the turning point, what is next. No hype." },
  { id: "shell", name: "Sully", outlet: "The Shell (fan blog)", ini: "SL", voice: "Sully, a lifelong, grumpy, old-school fan blogger for this school. Opinionated, funny, short paragraphs, loves the run game and defense, suspicious of the coaching staff, but every claim must still match the numbers." },
  { id: "steph", name: "Stat Sheet Steph", outlet: "By the Numbers (blog)", ini: "SS", voice: "Steph, an analytics blogger. Leads with one surprising number, explains what the stats say about the team, uses rates and comparisons computed only from the numbers given." }
];

const badge = (id, size = 34) => {
  const t = T[id] || { abbr: "?", color: null };
  return `<span class="badge" style="width:${size}px;height:${size}px;--c:${esc(t.color || "#5E5A52")};font-size:${Math.round(size * .36)}px" aria-hidden="true">${esc(t.abbr)}</span>`;
};
const nm = (id, fallback) => esc(T[id]?.name || fallback || "TBD");
const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 : 0);
const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);

function myGames() {
  const out = [];
  D.weeks.forEach((w) => w.games.forEach((g) => {
    if (g.a !== U && g.h !== U) return;
    const home = g.h === U;
    out.push({ week: w.label, current: w.current, id: g.id, home, opp: home ? g.a : g.h, oppName: home ? g.an : g.hn,
      us: home ? g.hs : g.as, them: home ? g.as : g.hs, final: g.st === "final", box: D.boxes.find((b) => b.id === g.id) });
  }));
  return out;
}
function teamSide(box) { return box.h === U || box.hRaw === U ? ["home", "away"] : ["away", "home"]; }

// Season totals for the user school from its box scores.
function seasonPlayers() {
  const map = {};
  for (const b of D.boxes) for (const p of b.players) {
    if (p.t !== U) continue;
    const k = p.n + "|" + p.pos;
    const m = map[k] ||= { n: p.n, pos: p.pos, games: [] };
    m.games.push({ id: b.id, p });
    for (const grp of ["pass", "rush", "rec", "def", "kick", "punt", "ret", "line"]) if (p[grp]) {
      m[grp] ||= {};
      for (const [s, v] of Object.entries(p[grp])) m[grp][s] = s === "lng" ? Math.max(m[grp][s] || 0, v) : (m[grp][s] || 0) + v;
    }
  }
  return Object.values(map);
}

function header() {
  const t = T[U] || {};
  document.documentElement.style.setProperty("--team", t.color || "#E03A3E");
  document.getElementById("mBadge").innerHTML = badge(U, 52);
  document.getElementById("mSub").textContent = `${t.name || ""} · ${t.conf || ""} · Coach ${D.coach?.name || ""}`;
  document.getElementById("kRecLab").textContent = `${D.league.season} record`;
  document.getElementById("kRec").textContent = t.rec || "0-0";
  document.getElementById("kStage").textContent = D.league.stage || "";
  const when = D.builtAt ? new Date(D.builtAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  document.getElementById("foot").textContent = `Data from your Dynasty Rewired sync, last captured ${when}. No team logos; badges use school colors.`;
}

function scheduleStrip(games) {
  return `<section aria-label="Schedule"><div class="hd"><h2>${D.league.season} schedule</h2><a href="#schedule" class="lab">Full schedule</a></div>
  <div class="strip"><div class="in">${games.map((g) => {
    const res = g.final ? `<span class="pill ${g.us > g.them ? "w" : "l"}">${g.us > g.them ? "W" : "L"} ${g.us}–${g.them}</span>` : `<span class="note">${g.current ? "This week" : "Upcoming"}</span>`;
    return `<a class="gcard${g.current ? " cur" : ""}" href="${g.final ? "#game-" + esc(g.id) : "#schedule"}">
      <span class="lab">${esc(g.week.replace("Week ", "Wk "))} · ${g.home ? "vs" : "at"}</span>${badge(g.opp, 30)}<span class="num" style="font-size:18px;line-height:1">${esc(T[g.opp]?.abbr || g.oppName)}</span>${res}</a>`;
  }).join("")}</div></div></section>`;
}

function quarterTable(b) {
  const row = (side, name) => `<tr><th scope="row">${esc(name)}</th>${["q1", "q2", "q3", "q4"].map((q) => `<td class="n">${b[side][q] || 0}</td>`).join("")}${b[side].ot ? `<td class="n">${b[side].ot}</td>` : ""}<td class="n"><b>${b[side].pts ?? (side === "home" ? b.hs : b.as)}</b></td></tr>`;
  return `<div class="scroll"><table><thead><tr><th>Team</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th>${b.home.ot || b.away.ot ? '<th class="n">OT</th>' : ""}<th class="n">T</th></tr></thead><tbody>${row("away", b.an)}${row("home", b.hn)}</tbody></table></div>`;
}

function leadersFor(b, team) {
  const ps = b.players.filter((p) => p.t === team);
  const top = (grp, key) => ps.filter((p) => p[grp]?.[key]).sort((x, y) => y[grp][key] - x[grp][key])[0];
  const out = [];
  const q = top("pass", "yds"); if (q) out.push(["Passing", q.n, `${q.pass.cmp || 0}/${q.pass.att || 0} · ${q.pass.yds} yds · ${q.pass.td || 0} TD${q.pass.int ? " · " + q.pass.int + " INT" : ""}`]);
  const r = top("rush", "yds"); if (r) out.push(["Rushing", r.n, `${r.rush.car} car · ${r.rush.yds} yds${r.rush.td ? " · " + r.rush.td + " TD" : ""}`]);
  const c = top("rec", "yds"); if (c) out.push(["Receiving", c.n, `${c.rec.rec} rec · ${c.rec.yds} yds${c.rec.td ? " · " + c.rec.td + " TD" : ""}`]);
  const d = top("def", "tkl"); if (d) out.push(["Tackles", d.n, `${d.def.tkl} tkl${d.def.sck ? " · " + d.def.sck + " sck" : ""}${d.def.tfl ? " · " + d.def.tfl + " TFL" : ""}`]);
  return out;
}

function storyBlock(gameId, compact) {
  const pieces = PERSONAS.map((p) => ({ p, s: stories[gameId + "-" + p.id] })).filter((x) => x.s);
  const can = !!sample;
  const list = pieces.map(({ p, s }) => `<article class="story" style="margin-top:14px">
      <div class="lab">${esc(p.name)} · ${esc(p.outlet)}</div><h3>${esc(s.headline)}</h3>${s.dek ? `<p class="dek">${esc(s.dek)}</p>` : ""}
      ${(compact ? String(s.body || "").split(/\n+/).slice(0, 1) : String(s.body || "").split(/\n+/)).map((x) => `<p>${esc(x)}</p>`).join("")}
      ${compact ? `<a class="lab" href="#game-${esc(gameId)}">Read the full story</a>` : can ? `<button class="btn" data-write="${esc(gameId)}" data-persona="${esc(p.id)}">Regenerate</button>${s.prev ? ` <button class="btn" data-undo="${esc(gameId)}" data-persona="${esc(p.id)}">Undo</button>` : ""}` : ""}
    </article>`).join("");
  const missing = PERSONAS.filter((p) => !stories[gameId + "-" + p.id]);
  const writers = can && missing.length && !compact ? `<div class="personas" role="group" aria-label="Write a story">${missing.map((p) => `<button data-write="${esc(gameId)}" data-persona="${esc(p.id)}">Write: ${esc(p.name)}</button>`).join("")}</div>` : "";
  const none = !pieces.length ? `<p class="muted" style="margin:6px 0">${can ? "No stories yet for this game." : "Stories can be written when Film Room is opened as your Claude page."}</p>${compact && can ? `<a class="btn solid" style="display:inline-flex;align-items:center;text-decoration:none" href="#game-${esc(gameId)}">Write the story</a>` : ""}` : "";
  return `<div id="stories-${esc(gameId)}">${compact ? list.split("</article>")[0] + (list ? "</article>" : "") : list}${none}${writers}<p class="note" id="status-${esc(gameId)}"></p></div>`;
}

function lastGameCard(g) {
  const b = g.box;
  const [us, them] = teamSide(b);
  const lead = leadersFor(b, U);
  return `<section class="card flush" aria-label="Last game">
    <div style="padding:14px 20px;border-bottom:1px solid var(--rule)" class="hd"><span class="lab">Last game · ${esc(g.week)} · Final</span><a class="lab" href="#game-${esc(g.id)}">Box score and recap</a></div>
    <div style="padding:18px 20px" class="row">
      <div class="score" style="flex:1 1 280px">
        <div style="text-align:center">${badge(b.a, 40)}<div class="big" ${b.as < b.hs ? 'style="color:var(--mute)"' : ""}>${b.as}</div></div>
        <span class="muted" style="font-family:Fraunces,serif;font-size:20px">at</span>
        <div style="text-align:center">${badge(b.h, 40)}<div class="big" ${b.hs < b.as ? 'style="color:var(--mute)"' : ""}>${b.hs}</div></div>
      </div>
      <div style="flex:1 1 300px">${quarterTable(b)}</div>
    </div>
    <div style="padding:0 20px 18px" class="grid3">${lead.slice(0, 3).map(([c, n, l]) => `<div class="lead"><div class="lab">${esc(c)}</div><div style="font-weight:700">${esc(n)}</div><div class="note">${esc(l)}</div></div>`).join("")}</div>
    <div style="padding:16px 20px;border-top:1px solid var(--rule)">${storyBlock(g.id, true)}</div>
  </section>`;
}

function nextGameCard(g) {
  if (!g) return `<section class="card"><h2>Season complete</h2></section>`;
  const me = T[U], op = T[g.opp] || {};
  const comp = [["Overall", me.ovr, op.ovr], ["Offense", me.off, op.off], ["Defense", me.def, op.def]];
  const tops = (D.topPlayers[g.opp] || []).slice(0, 3);
  return `<section class="card" aria-label="Next game">
    <div class="lab">Up next · ${esc(g.week)}</div>
    <div style="display:flex;gap:12px;align-items:center;margin:8px 0 4px">${badge(g.opp, 44)}<div><h2 style="font-size:24px">${g.home ? "vs" : "at"} ${nm(g.opp, g.oppName)}</h2><div class="note">${esc(op.rec || "")}${op.confRec ? " · " + esc(op.confRec) + " " + esc(op.conf || "") : ""}${op.stars ? " · " + op.stars + "★ prestige" : ""}</div></div></div>
    <div style="margin-top:10px">${comp.map(([l, a, b]) => `<div class="brow"><span>${l}</span><div><div class="bar" title="${esc(me.abbr)}"><i style="width:${a || 0}%"></i></div><div class="bar" style="margin-top:3px" title="${esc(op.abbr)}"><i class="o" style="width:${b || 0}%"></i></div></div><span class="num">${a ?? "–"}<span class="muted" style="font-size:14px"> / ${b ?? "–"}</span></span></div>`).join("")}</div>
    <div class="key"><span><i style="background:var(--team)"></i>${esc(me.abbr)}</span><span><i style="background:var(--opp)"></i>${esc(op.abbr || "")}</span></div>
    ${tops.length ? `<div class="lab" style="margin-top:14px">Players to watch</div>${tops.map((p) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--rule);font-size:14px"><span><b>${esc(p.n)}</b> <span class="muted">${esc(p.pos)} · ${esc(p.yr)}</span></span><span class="num" style="font-size:18px">${p.ovr}</span></div>`).join("")}` : ""}
  </section>`;
}

function snapshot(games) {
  const done = games.filter((g) => g.final && g.box);
  if (!done.length) return "";
  const n = done.length;
  const mine = done.map((g) => g.box[teamSide(g.box)[0]]), theirs = done.map((g) => g.box[teamSide(g.box)[1]]);
  const pts = sum(done, (g) => g.us), opp = sum(done, (g) => g.them);
  const yds = sum(mine, (s) => s.yds), plays = sum(mine, (s) => s.plays);
  const third = sum(mine, (s) => s.thirdConv), thirdA = sum(mine, (s) => s.thirdAtt);
  const sacked = sum(done, (g) => sum(g.box.players.filter((p) => p.t === U), (p) => p.pass?.sck));
  const to = sum(mine, (s) => s.turnovers), take = sum(theirs, (s) => s.turnovers);
  const items = [[(pts / n).toFixed(1), "Points per game"], [(opp / n).toFixed(1), "Points allowed per game"], [(yds / n).toFixed(0), "Yards per game"],
    [plays ? (yds / plays).toFixed(1) : "–", "Yards per play"], [thirdA ? pct(third, thirdA) + "%" : "–", `Third downs (${third}/${thirdA})`],
    [(take - to > 0 ? "+" : "") + (take - to), `Turnover margin (${take} won, ${to} lost)`], [sacked, "Sacks allowed"], [sum(done, (g) => sum(g.box.players.filter((p) => p.t === U), (p) => p.def?.sck)), "Sacks by the defense"]];
  return `<section class="card" aria-label="Season snapshot"><h2 style="margin-bottom:14px">Season snapshot</h2><div class="grid2">${items.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div></section>`;
}

function quarterChart(games) {
  const done = games.filter((g) => g.final && g.box);
  if (!done.length) return "";
  const q = ["q1", "q2", "q3", "q4"].map((k) => [sum(done, (g) => g.box[teamSide(g.box)[0]][k]), sum(done, (g) => g.box[teamSide(g.box)[1]][k])]);
  const max = Math.max(1, ...q.flat());
  return `<section class="card" aria-label="Points by quarter"><div class="hd"><h2>Points by quarter</h2><span class="note">Season, ${done.length} games</span></div>
    <div class="cols">${q.map(([a, b]) => `<div class="col"><div class="pair"><i style="height:${(a / max) * 100}%;background:var(--team)" title="${a}"></i><i style="height:${(b / max) * 100}%;background:var(--opp)" title="${b}"></i></div><span class="v">${a}–${b}</span></div>`).join("")}</div>
    <div class="xl"><span>1st</span><span>2nd</span><span>3rd</span><span>4th</span></div>
    <div class="key"><span><i style="background:var(--team)"></i>${esc(T[U].abbr)} scored</span><span><i style="background:var(--opp)"></i>Opponents scored</span></div></section>`;
}

function yardsChart(games) {
  const done = games.filter((g) => g.final && g.box);
  if (!done.length) return "";
  const rows = done.map((g) => { const s = g.box[teamSide(g.box)[0]]; return { opp: T[g.opp]?.abbr || g.oppName, rush: s.rushYds || 0, pass: s.passYds || 0 }; });
  const max = Math.max(1, ...rows.map((r) => r.rush + r.pass));
  return `<section class="card" aria-label="Yards per game"><div class="hd"><h2>Yards by game</h2><span class="note">Pass on top of rush</span></div>
    <div class="cols">${rows.map((r) => `<div class="col"><span class="v">${r.rush + r.pass}</span><div class="stack" style="height:${((r.rush + r.pass) / max) * 82}%"><i style="display:block;height:${pct(r.rush, r.rush + r.pass)}%;background:var(--opp)"></i><i style="display:block;height:${pct(r.pass, r.rush + r.pass)}%;background:var(--team)"></i></div></div>`).join("")}</div>
    <div class="xl">${rows.map((r) => `<span>${esc(r.opp)}</span>`).join("")}</div>
    <div class="key"><span><i style="background:var(--team)"></i>Passing</span><span><i style="background:var(--opp)"></i>Rushing</span></div></section>`;
}

function leadersCard() {
  const ps = seasonPlayers();
  const best = (grp, key) => ps.filter((p) => p[grp]?.[key]).sort((a, b) => b[grp][key] - a[grp][key])[0];
  const spark = (p, grp, key) => {
    const vals = p.games.map((g) => g.p[grp]?.[key] || 0), m = Math.max(1, ...vals);
    return `<span style="display:inline-flex;gap:3px;align-items:flex-end;height:22px" aria-hidden="true">${vals.map((v) => `<i style="width:7px;height:${Math.max(2, (v / m) * 22)}px;background:var(--team);border-radius:2px;display:block"></i>`).join("")}</span>`;
  };
  const rows = [];
  let p;
  if ((p = best("pass", "yds"))) rows.push(["Passing", p, `${p.pass.cmp}/${p.pass.att} · ${p.pass.yds} yds · ${p.pass.td || 0} TD · ${p.pass.int || 0} INT`, spark(p, "pass", "yds")]);
  if ((p = best("rush", "yds"))) rows.push(["Rushing", p, `${p.rush.car} car · ${p.rush.yds} yds · ${p.rush.td || 0} TD`, spark(p, "rush", "yds")]);
  if ((p = best("rec", "yds"))) rows.push(["Receiving", p, `${p.rec.rec} rec · ${p.rec.yds} yds · ${p.rec.td || 0} TD`, spark(p, "rec", "yds")]);
  if ((p = best("def", "tkl"))) rows.push(["Tackles", p, `${p.def.tkl} tkl${p.def.tfl ? " · " + p.def.tfl + " TFL" : ""}`, spark(p, "def", "tkl")]);
  if ((p = best("def", "sck"))) rows.push(["Sacks", p, `${p.def.sck} sacks`, spark(p, "def", "sck")]);
  if ((p = best("def", "int"))) rows.push(["Interceptions", p, `${p.def.int} INT`, spark(p, "def", "int")]);
  return `<section class="card" aria-label="Season leaders"><div class="hd"><h2>Season leaders</h2><span class="note">Bars show each game</span></div><div class="scroll"><table><tbody>
    ${rows.map(([c, pl, line, sp]) => `<tr><td class="muted" style="font-weight:600">${c}</td><td><b>${esc(pl.n)}</b> <span class="muted">${esc(pl.pos)}</span></td><td class="n" style="text-align:left">${esc(line)}</td><td>${sp}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

function trenches() {
  const roster = D.rosters[U] || [];
  const ps = seasonPlayers().filter((p) => ["LT", "LG", "C", "RG", "RT"].includes(p.pos));
  const order = ["LT", "LG", "C", "RG", "RT"];
  const starters = order.map((pos) => ps.filter((p) => p.pos === pos).sort((a, b) => b.games.length - a.games.length)[0]).filter(Boolean);
  if (!starters.length) return "";
  const sacks = sum(starters, (p) => p.line?.sckAllowed);
  return `<section class="card" aria-label="The trenches"><div class="hd"><h2>The trenches</h2><span class="note">${sacks} sacks allowed by the starters</span></div>
    ${starters.map((p) => { const r = roster.find((x) => x.n === p.n) || {}; return `<div class="brow" style="grid-template-columns:34px minmax(0,1fr) 44px"><span class="num muted">${esc(p.pos)}</span>
      <div><div style="display:flex;justify-content:space-between;gap:6px;font-size:14px"><b>${esc(p.n)}</b><span class="note">${p.line?.sckAllowed || 0} sck · ${p.line?.pancakes || 0} pancakes</span></div>
      <div class="bar" style="margin-top:4px" title="Pass block ${r.rt?.PPBK ?? ""}"><i style="width:${r.rt?.PPBK || 0}%"></i></div><div class="bar" style="margin-top:3px" title="Run block ${r.rt?.PRBK ?? ""}"><i class="o" style="width:${r.rt?.PRBK || 0}%"></i></div></div>
      <span class="num">${r.ovr ?? "–"}</span></div>`; }).join("")}
    <div class="key"><span><i style="background:var(--team)"></i>Pass block</span><span><i style="background:var(--opp)"></i>Run block</span><span>Number: overall</span></div></section>`;
}

function topPoll(n = 10) {
  const w = [...D.polls].reverse().find((p) => p.media);
  if (!w) return "";
  return `<section class="card" aria-label="Top 25"><div class="hd"><h2>${esc(w.label)} poll</h2><a class="lab" href="#league">Full Top 25</a></div>
    ${w.media.slice(0, n).map((r) => { const mv = r.pr ? r.pr - r.r : null; return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--rule)"><span class="num" style="width:22px;font-size:19px">${r.r}</span>${badge(r.t, 26)}<span style="flex:1;font-weight:600;font-size:14px">${esc(r.s)} <span class="muted" style="font-weight:400">${esc(r.rec)}</span></span><span class="note">${mv == null ? "new" : mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : "–"}</span></div>`; }).join("")}</section>`;
}

function home() {
  const games = myGames();
  const last = [...games].reverse().find((g) => g.final && g.box);
  const next = games.find((g) => !g.final);
  return `${scheduleStrip(games)}
  <div class="row"><div class="main" style="display:flex;flex-direction:column;gap:24px">${last ? lastGameCard(last) : `<section class="card"><h2>No games yet</h2></section>`}<div class="row"><div style="flex:1 1 300px">${quarterChart(games)}</div><div style="flex:1 1 300px">${yardsChart(games)}</div></div>${leadersCard()}</div>
  <aside class="side">${nextGameCard(next)}${snapshot(games)}${trenches()}${topPoll()}</aside></div>`;
}

function boxTables(b, team, title) {
  const ps = b.players.filter((p) => p.t === team);
  const sect = (label, grp, cols) => {
    const rows = ps.filter((p) => p[grp]).sort((x, y) => (y[grp][cols[0][0]] || 0) - (x[grp][cols[0][0]] || 0));
    if (!rows.length) return "";
    return `<div class="scroll" style="margin-bottom:14px"><table><thead><tr><th>${label}</th>${cols.map(([, h]) => `<th class="n">${h}</th>`).join("")}</tr></thead><tbody>${rows.map((p) => `<tr><td><b>${esc(p.n)}</b> <span class="muted">${esc(p.pos)}</span></td>${cols.map(([k]) => `<td class="n">${p[grp][k] ?? 0}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  if (!ps.some((p) => p.pass || p.rush || p.rec || p.def)) return `<section class="card" style="flex:1 1 460px"><h2>${esc(title)}</h2><p class="muted">The game did not record player stats for this team.</p></section>`;
  return `<section class="card" style="flex:1 1 460px"><div class="hd"><h2>${esc(title)}</h2></div>
    ${sect("Passing", "pass", [["yds", "YDS"], ["cmp", "CMP"], ["att", "ATT"], ["td", "TD"], ["int", "INT"], ["sck", "SCK"]])}
    ${sect("Rushing", "rush", [["yds", "YDS"], ["car", "CAR"], ["td", "TD"], ["lng", "LNG"]])}
    ${sect("Receiving", "rec", [["yds", "YDS"], ["rec", "REC"], ["td", "TD"], ["lng", "LNG"]])}
    ${sect("Defense", "def", [["tkl", "TKL"], ["tfl", "TFL"], ["sck", "SCK"], ["int", "INT"], ["pd", "PD"]])}
    ${sect("Line", "line", [["pancakes", "PANC"], ["sckAllowed", "SCK ALW"]])}
    ${sect("Kicking", "kick", [["fgm", "FGM"], ["fga", "FGA"], ["lng", "LNG"], ["xpm", "XPM"], ["xpa", "XPA"]])}
    ${sect("Punting", "punt", [["yds", "YDS"], ["no", "NO"], ["lng", "LNG"], ["in20", "IN 20"]])}
  </section>`;
}

function teamCompare(b) {
  const rows = [["Total yards", "yds"], ["Passing yards", "passYds"], ["Rushing yards", "rushYds"], ["First downs", "firstDowns"], ["Plays", "plays"], ["Turnovers", "turnovers"], ["Penalty yards", "penYds"]];
  const top = (s) => (s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "–");
  return `<section class="card" aria-label="Team stats"><div class="hd"><h2>Team stats</h2><span class="note">${esc(T[b.a]?.abbr)} · ${esc(T[b.h]?.abbr)}</span></div>
    ${rows.map(([l, k]) => { const a = b.away[k] || 0, h = b.home[k] || 0, m = Math.max(1, a + h); return `<div style="padding:6px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span class="num" style="font-size:18px">${a}</span><span class="muted">${l}</span><span class="num" style="font-size:18px">${h}</span></div><div style="display:flex;gap:4px"><div class="bar" style="flex:1;direction:rtl"><i class="${b.a === U ? "" : "o"}" style="width:${(a / m) * 100}%"></i></div><div class="bar" style="flex:1"><i class="${b.h === U ? "" : "o"}" style="width:${(h / m) * 100}%"></i></div></div></div>`; }).join("")}
    <div style="display:flex;justify-content:space-between;font-size:14px;padding-top:8px;border-top:1px solid var(--rule)"><span class="num" style="font-size:18px">${b.away.thirdConv || 0}/${b.away.thirdAtt || 0}</span><span class="muted">Third downs</span><span class="num" style="font-size:18px">${b.home.thirdConv || 0}/${b.home.thirdAtt || 0}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:14px;padding-top:8px"><span class="num" style="font-size:18px">${top(b.away.top)}</span><span class="muted">Possession</span><span class="num" style="font-size:18px">${top(b.home.top)}</span></div></section>`;
}

function game(id) {
  const b = D.boxes.find((x) => x.id === id);
  if (!b) return `<section class="card empty">That game has no box score yet.</section>`;
  const [us] = teamSide(b);
  const won = (us === "home" ? b.hs : b.as) > (us === "home" ? b.as : b.hs);
  return `<section class="card" style="background:color-mix(in srgb,var(--team) 78%,black);color:#fff;border:0">
      <div class="lab" style="color:#fff">${esc(b.week)} · Final · ${won ? "Win" : "Loss"}</div>
      <div class="row" style="margin-top:10px;align-items:center">
        <div class="score" style="flex:1 1 320px"><div style="text-align:center">${badge(b.a, 46)}<div class="big">${b.as}</div><div style="font-weight:600">${esc(b.an)}</div></div><span style="font-family:Fraunces,serif;font-size:22px">at</span><div style="text-align:center">${badge(b.h, 46)}<div class="big">${b.hs}</div><div style="font-weight:600">${esc(b.hn)}</div></div></div>
        <div style="flex:1 1 300px;background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px">${quarterTable(b)}</div>
      </div></section>
    <div class="row"><section class="card main" aria-label="Stories"><div class="hd"><h2>The newsroom</h2></div>${storyBlock(b.id, false)}</section><div class="side">${teamCompare(b)}</div></div>
    <div class="row">${boxTables(b, b.aRaw, b.an)}${boxTables(b, b.hRaw, b.hn)}</div>`;
}

function schedulePage() {
  const games = myGames();
  const wk = Math.max(0, D.weeks.findIndex((w) => w.current) - 1);
  return `<section class="card"><div class="hd"><h2>${esc(T[U].name)} schedule</h2></div><div class="scroll"><table class="stack"><thead><tr><th>Week</th><th>Opponent</th><th>Their record</th><th class="n">Result</th></tr></thead><tbody>
    ${games.map((g) => `<tr><td>${esc(g.week)}</td><td><span style="display:inline-flex;gap:8px;align-items:center">${badge(g.opp, 26)}<span>${g.home ? "vs" : "at"} <b>${nm(g.opp, g.oppName)}</b></span></span></td><td>${esc(T[g.opp]?.rec || "")}</td><td class="n">${g.final ? `<a href="#game-${esc(g.id)}">${g.us > g.them ? "W" : "L"} ${g.us}–${g.them}</a>` : '<span class="muted">–</span>'}</td></tr>`).join("")}
  </tbody></table></div></section>
  <section class="card"><div class="hd"><h2>National scoreboard</h2><label class="note">Week <select id="wkSel">${D.weeks.map((w, i) => `<option value="${i}" ${i === wk ? "selected" : ""}>${esc(w.label)}</option>`).join("")}</select></label></div><div id="board"></div></section>`;
}
function board(i) {
  const w = D.weeks[i];
  const games = [...w.games].sort((a, b) => (b.au || b.hu) - (a.au || a.hu));
  document.getElementById("board").innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px">${games.map((g) => {
    const fin = g.st === "final";
    const line = (id, n, s, other) => `<div style="display:flex;align-items:center;gap:8px;padding:3px 0">${badge(id, 24)}<span style="flex:1;font-size:14px;${fin && s < other ? "color:var(--mute)" : "font-weight:600"}">${esc(n)}</span><span class="num" style="font-size:18px">${fin ? s : ""}</span></div>`;
    const mine = g.a === U || g.h === U;
    return `<div style="border:1px solid ${mine ? "var(--team)" : "var(--rule)"};border-radius:10px;padding:8px 10px">${line(g.a, g.an, g.as, g.hs)}${line(g.h, g.hn, g.hs, g.as)}<div class="note">${fin ? "Final" : "Not played"}${mine && fin ? ` · <a href="#game-${esc(g.id)}">Box score</a>` : ""}</div></div>`;
  }).join("")}</div>`;
}

const DEV = ["Normal", "Impact", "Star", "Elite"];
const GROUPS = [["QB", ["QB"]], ["Running backs", ["HB", "FB"]], ["Receivers", ["WR"]], ["Tight ends", ["TE"]], ["Offensive line", ["OL"]], ["Defensive line", ["DL"]], ["Linebackers", ["LB"]], ["Cornerbacks", ["CB"]], ["Safeties", ["S"]], ["Specialists", ["K", "P"]]];
const STARTERS = { QB: 1, "Running backs": 1, Receivers: 3, "Tight ends": 1, "Offensive line": 5, "Defensive line": 4, Linebackers: 3, Cornerbacks: 3, Safeties: 2, Specialists: 2 };
let rosterFilter = "All";
function rosterPage() {
  const r = D.rosters[U] || [];
  const strength = GROUPS.map(([g, ps]) => { const top = r.filter((p) => ps.includes(p.pos)).sort((a, b) => b.ovr - a.ovr).slice(0, STARTERS[g]); return [g, top.length ? Math.round(sum(top, (p) => p.ovr) / top.length) : 0, top.length]; });
  const devCount = [0, 1, 2, 3].map((d) => r.filter((p) => p.dev === d).length);
  return `<div class="row"><section class="card" style="flex:1 1 380px"><div class="hd"><h2>Position strength</h2><span class="note">Average of likely starters</span></div>
    ${strength.map(([g, v]) => `<div class="brow"><span style="font-size:13px">${g}</span><div class="bar"><i style="width:${v}%"></i></div><span class="num">${v || "–"}</span></div>`).join("")}</section>
    <section class="card" style="flex:1 1 280px"><h2 style="margin-bottom:14px">Roster at a glance</h2><div class="grid2">
      <div class="stat"><b>${r.length}</b><span>Players</span></div><div class="stat"><b>${r.filter((p) => p.ovr >= 80).length}</b><span>Rated 80 or higher</span></div>
      ${devCount.map((c, i) => `<div class="stat"><b>${c}</b><span>${DEV[i]} dev</span></div>`).join("")}</div></section></div>
  <section class="card"><div class="hd"><h2>Roster</h2><label class="note">Position <select id="posSel">${["All", ...new Set(r.map((p) => p.pos))].map((p) => `<option ${p === rosterFilter ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></label></div><div id="rosterTable"></div></section>`;
}
function rosterTable() {
  const r = (D.rosters[U] || []).filter((p) => rosterFilter === "All" || p.pos === rosterFilter);
  const ht = (i) => (i ? `${Math.floor(i / 12)}'${i % 12}"` : "");
  document.getElementById("rosterTable").innerHTML = `<div class="scroll"><table class="stack"><thead><tr><th>Player</th><th>Pos</th><th>Year</th><th>Dev</th><th class="n">SPD</th><th class="n">OVR</th></tr></thead><tbody>
    ${r.map((p) => `<tr><td><details><summary><b>${esc(p.n)}</b>&nbsp;<span class="muted">#${p.j}</span></summary><div class="note" style="padding:4px 0 8px">${ht(p.ht)}, ${p.wt || ""} lb${p.nil ? " · NIL " + esc(p.nil) : ""}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(p.rt || {}).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => `<span class="tag">${esc(RT[k] || k)} ${v}</span>`).join("")}</div>
      ${p.ab?.length ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">${p.ab.map(([a, t]) => `<span class="tag" style="border-color:var(--team)">${esc(a)} · ${esc(t)}</span>`).join("")}</div>` : ""}</details></td>
      <td>${esc(p.pos)}</td><td>${esc(p.yr)}</td><td>${p.dev != null ? DEV[p.dev] : ""}</td><td class="n">${p.spd ?? ""}</td><td class="n"><b>${p.ovr}</b></td></tr>`).join("")}
  </tbody></table></div>`;
}
const RT = { PSPD: "Speed", PACC: "Accel", PAGI: "Agility", PSTR: "Strength", PAWR: "Awareness", PTHP: "Throw power", PTHA: "Throw acc", PTUP: "Under pressure", PCAR: "Carrying", PBCV: "Vision", PBTK: "Break tackle", PCTH: "Catching", PRRS: "Short routes", PRRM: "Mid routes", PRRD: "Deep routes", PPBK: "Pass block", PRBK: "Run block", PTAK: "Tackle", PBSG: "Block shed", PLPU: "Pursuit", PLPR: "Play rec", PLMC: "Man cover", PLZC: "Zone cover", PKPR: "Kick power", PKAC: "Kick acc" };

let conf = null, pollKind = "media";
function leaguePage() {
  conf ||= T[U].conf;
  const confs = [...new Set(D.teams.filter((t) => !t.fcs).map((t) => t.conf))].sort();
  return `<div class="row"><section class="card" style="flex:1 1 440px"><div class="hd"><h2>Standings</h2><select id="confSel" aria-label="Conference">${confs.map((c) => `<option ${c === conf ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div><div id="standings"></div></section>
    <section class="card" style="flex:1 1 360px"><div class="hd"><h2>Top 25</h2><div class="personas" role="group" aria-label="Poll" style="margin:0"><button data-poll="media" aria-pressed="${pollKind === "media"}">Media</button><button data-poll="coaches" aria-pressed="${pollKind === "coaches"}">Coaches</button></div></div><div id="poll"></div></section></div>
    <div class="row"><section class="card" style="flex:1 1 440px"><div class="hd"><h2>Recruiting class rankings</h2><span class="note">Stars of committed recruits</span></div><div id="classes"></div></section>
    <section class="card" style="flex:1 1 360px"><div class="hd"><h2>Top recruits</h2></div><div class="scroll" style="max-height:520px;overflow-y:auto"><table><thead><tr><th class="n">#</th><th>Recruit</th><th>Pos</th><th class="n">★</th></tr></thead><tbody>${D.recruits.slice(0, 100).map((r) => `<tr><td class="n">${r.r}</td><td><b>${esc(r.n)}</b><div class="note">${esc(r.from)}${r.arch ? " · " + esc(r.arch) : ""}</div></td><td>${esc(r.pos)}</td><td class="n">${r.s}</td></tr>`).join("")}</tbody></table></div></section></div>`;
}
function standings() {
  const ts = D.teams.filter((t) => t.conf === conf).sort((a, b) => (b.cw - b.cl) - (a.cw - a.cl) || (b.w - b.l) - (a.w - a.l) || (b.ovr || 0) - (a.ovr || 0));
  document.getElementById("standings").innerHTML = `<div class="scroll"><table><thead><tr><th>Team</th><th class="n">Conf</th><th class="n">Overall</th><th class="n">OVR</th></tr></thead><tbody>${ts.map((t) => `<tr style="${t.user ? "box-shadow:inset 3px 0 0 var(--team)" : ""}"><td><span style="display:inline-flex;gap:8px;align-items:center">${badge(t.id, 24)}<b>${esc(t.name)}</b></span></td><td class="n">${esc(t.confRec)}</td><td class="n">${esc(t.rec)}</td><td class="n">${t.ovr ?? ""}</td></tr>`).join("")}</tbody></table></div>`;
}
function poll() {
  const w = [...D.polls].reverse().find((p) => p[pollKind]);
  document.getElementById("poll").innerHTML = !w ? '<p class="muted">Not released yet.</p>' : `<div class="note" style="margin-bottom:6px">${esc(w.label)}</div>${w[pollKind].map((r) => { const mv = r.pr ? r.pr - r.r : null; return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--rule)"><span class="num" style="width:24px;font-size:18px">${r.r}</span>${badge(r.t, 24)}<span style="flex:1;font-size:14px;font-weight:600">${esc(r.s)} <span class="muted" style="font-weight:400">${esc(r.rec)}</span></span><span class="note">${mv == null ? "new" : mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : "–"}</span></div>`; }).join("")}`;
}
function classesTable() {
  const top = D.classes.slice(0, 25), mine = D.classes.find((c) => c.t === U);
  const rows = mine && !top.includes(mine) ? [...top, mine] : top;
  const max = Math.max(1, ...rows.map((c) => c.pts || 0));
  document.getElementById("classes").innerHTML = rows.length ? rows.map((c) => `<div class="brow" style="grid-template-columns:30px minmax(0,1fr) 80px;${c.t === U ? "box-shadow:inset 3px 0 0 var(--team);padding-left:6px" : ""}"><span class="num muted">${c.r}</span><div><div style="font-size:14px;font-weight:600">${esc(c.s)} <span class="note">${c.n} commits</span></div><div class="bar"><i class="${c.t === U ? "" : "o"}" style="width:${((c.pts || 0) / max) * 100}%"></i></div></div><span class="note" style="text-align:right">${c.st.map((n, i) => (n ? `${n}×${5 - i}★` : "")).filter(Boolean).join(" ") || "–"}</span></div>`).join("") : '<p class="muted">No classes yet.</p>';
}

function newsroom() {
  const done = myGames().filter((g) => g.final && g.box).reverse();
  return `<section class="card"><div class="hd"><h2>The newsroom</h2><span class="note">${sample ? "Open a game to write or regenerate its stories." : ""}</span></div>
    ${done.map((g) => `<div style="border-top:2px solid var(--ink);padding-top:12px;margin-top:12px"><div class="hd"><span style="display:inline-flex;gap:10px;align-items:center">${badge(g.opp, 30)}<b>${esc(g.week)}: ${g.home ? "vs" : "at"} ${nm(g.opp, g.oppName)}, ${g.us > g.them ? "W" : "L"} ${g.us}–${g.them}</b></span><a class="lab" href="#game-${esc(g.id)}">Open game</a></div>${storyBlock(g.id, true)}</div>`).join("") || '<p class="muted">No games yet.</p>'}</section>`;
}

// Story writing through Claude, saved in this page's database.
function factsFor(b) {
  const lines = [];
  const side = (s, name) => `${name}: ${s.pts ?? ""} points (quarters ${[s.q1, s.q2, s.q3, s.q4].map((x) => x || 0).join("-")}${s.ot ? ", OT " + s.ot : ""}), ${s.yds || 0} total yards (${s.passYds || 0} pass, ${s.rushYds || 0} rush), ${s.firstDowns || 0} first downs, third downs ${s.thirdConv || 0}/${s.thirdAtt || 0}, turnovers ${s.turnovers || 0}, penalties ${s.pen || 0} for ${s.penYds || 0} yards.`;
  lines.push(`${b.week}. ${b.an} at ${b.hn}. Final: ${b.an} ${b.as}, ${b.hn} ${b.hs}.`);
  lines.push(side(b.away, b.an), side(b.home, b.hn));
  for (const [team, name] of [[b.aRaw, b.an], [b.hRaw, b.hn]]) {
    const ps = b.players.filter((p) => p.t === team);
    const f = (p) => [p.pass && `passing ${p.pass.cmp || 0}/${p.pass.att || 0}, ${p.pass.yds || 0} yds, ${p.pass.td || 0} TD, ${p.pass.int || 0} INT, sacked ${p.pass.sck || 0}`, p.rush && `rushing ${p.rush.car || 0}-${p.rush.yds || 0}, ${p.rush.td || 0} TD`, p.rec && `receiving ${p.rec.rec || 0}-${p.rec.yds || 0}, ${p.rec.td || 0} TD`, p.def && `defense ${p.def.tkl || 0} tkl${p.def.sck ? ", " + p.def.sck + " sck" : ""}${p.def.int ? ", " + p.def.int + " INT" : ""}${p.def.tfl ? ", " + p.def.tfl + " TFL" : ""}`, p.kick && `kicking FG ${p.kick.fgm || 0}/${p.kick.fga || 0}, XP ${p.kick.xpm || 0}/${p.kick.xpa || 0}`, p.line?.sckAllowed && `allowed ${p.line.sckAllowed} sack(s)`].filter(Boolean).join("; ");
    lines.push(`${name} players:\n` + ps.map((p) => `- ${p.n} (${p.pos}): ${f(p)}`).filter((l) => !l.endsWith(": ")).join("\n"));
  }
  const me = T[U];
  const done = myGames().filter((g) => g.final);
  lines.push(`Context: ${me.name} (${me.conf}) is coached by ${D.coach?.name || "the user"}; season record now ${me.rec}, conference ${me.confRec}. Season results so far: ${done.map((g) => `${g.week} ${g.home ? "vs" : "at"} ${T[g.opp]?.name || g.oppName} ${g.us}-${g.them}`).join("; ")}.`);
  const nx = myGames().find((g) => !g.final);
  if (nx) lines.push(`Next game: ${nx.week} ${nx.home ? "vs" : "at"} ${T[nx.opp]?.name || nx.oppName} (${T[nx.opp]?.rec || ""}).`);
  return lines.join("\n");
}
async function write(gameId, personaId) {
  const b = D.boxes.find((x) => x.id === gameId), p = PERSONAS.find((x) => x.id === personaId);
  const st = document.getElementById("status-" + gameId);
  document.querySelectorAll(`[data-write="${gameId}"]`).forEach((x) => (x.disabled = true));
  st.textContent = `${p.name} is writing…`;
  const prompt = `You write for "Film Room", a newspaper-style site about one person's College Football 27 video game dynasty. Write as ${p.voice}
Cover this game from ${T[U].name}'s point of view. Use ONLY the facts below. Do not invent any statistic, quote, injury, play-by-play detail, crowd detail, weather or player not listed. Rates or totals you state must be computed from these numbers. Refer to the schools by the names given.
Length: 170 to 260 words in 3 to 5 short paragraphs. No em dashes. No hashtags or emoji.
Return JSON only: {"headline": string (under 12 words), "dek": string (one sentence), "body": string (paragraphs separated by blank lines)}.

FACTS
${factsFor(b)}`;
  try {
    const res = await sample.json(prompt, { modelTier: "default" });
    if (!res?.headline || !res?.body) throw { message: "The story came back empty." };
    const key = gameId + "-" + personaId, old = stories[key];
    const doc = { gameId, persona: personaId, headline: String(res.headline), dek: String(res.dek || ""), body: String(res.body), at: Date.now(),
      prev: old ? { headline: old.headline, dek: old.dek, body: old.body, at: old.at } : null };
    stories[key] = doc;
    if (db) { try { await db.doc("stories/" + key).set(doc); } catch (e) { st.textContent = "Written, but it could not be saved: " + (e?.message || ""); } }
    route();
  } catch (e) {
    st.textContent = e?.code === "rate_limited" ? "Claude is busy. Try again in a minute." : e?.code === "not_granted" ? "Story writing was not allowed for this page." : "That did not work: " + (e?.message || "unknown error");
    document.querySelectorAll(`[data-write="${gameId}"]`).forEach((x) => (x.disabled = false));
  }
}
async function undo(gameId, personaId) {
  const key = gameId + "-" + personaId, s = stories[key];
  if (!s?.prev) return;
  const doc = { ...s, ...s.prev, prev: null };
  stories[key] = doc;
  if (db) { try { await db.doc("stories/" + key).set(doc); } catch {} }
  route();
}

function route() {
  if (!D) return;
  const h = (location.hash || "#home").slice(1);
  const tab = h.startsWith("game-") ? "" : h;
  document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.getAttribute("href") === "#" + tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (h.startsWith("game-")) app.innerHTML = game(h.slice(5));
  else if (h === "schedule") { app.innerHTML = schedulePage(); board(+document.getElementById("wkSel").value); }
  else if (h === "roster") { app.innerHTML = rosterPage(); rosterTable(); }
  else if (h === "league") { app.innerHTML = leaguePage(); standings(); poll(); classesTable(); }
  else if (h === "newsroom") app.innerHTML = newsroom();
  else app.innerHTML = home();
}

app.addEventListener("click", (e) => {
  const w = e.target.closest("[data-write]"); if (w && sample) return write(w.dataset.write, w.dataset.persona);
  const u = e.target.closest("[data-undo]"); if (u) return undo(u.dataset.undo, u.dataset.persona);
  const p = e.target.closest("[data-poll]"); if (p) { pollKind = p.dataset.poll; document.querySelectorAll("[data-poll]").forEach((b) => b.setAttribute("aria-pressed", b === p)); poll(); }
});
app.addEventListener("change", (e) => {
  if (e.target.id === "wkSel") board(+e.target.value);
  if (e.target.id === "posSel") { rosterFilter = e.target.value; rosterTable(); }
  if (e.target.id === "confSel") { conf = e.target.value; standings(); }
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

fetch("film-room.json").then((r) => r.json()).then((d) => {
  D = d; U = d.user; T = Object.fromEntries(d.teams.map((t) => [t.id, t])); UT = T[U];
  header(); route();
}).catch(() => { app.innerHTML = '<section class="card empty">Could not load the dynasty data.</section>'; });

// Optional powers when opened as a Claude page: Claude writes stories, the database keeps them.
if (window.claude?.use) {
  claude.use("sample").then((s) => { sample = s; route(); });
  claude.use("db").then((d) => {
    db = d; if (!db) return;
    const timer = setTimeout(() => {}, 10000);
    db.collection("stories").get().then((snap) => {
      clearTimeout(timer);
      const docs = snap?.docs || snap || [];
      for (const doc of docs) { const v = typeof doc.data === "function" ? doc.data() : doc; if (v?.gameId) stories[v.gameId + "-" + v.persona] = v; }
      route();
    }).catch(() => clearTimeout(timer));
  });
}
}
</script>
